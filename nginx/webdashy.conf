# WebDashy — Nginx reverse proxy config
#
# IP-only for now (no domain / TLS yet — see DEPLOYMENT.md "Future: domain + TLS").
# `server_name _;` matches any Host header, so this works for direct IP access.
#
# Current state: serves a placeholder response since the `app` container
# doesn't exist yet (Phase 1 of ROADMAP.md). Once app/ Dockerfile + service
# are added to docker-compose.yml, uncomment the proxy_pass block below and
# remove the placeholder `location /` block.

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;  # headroom for template screenshot uploads

    # --- Placeholder (remove once the app service exists) ---
    location / {
        return 200 "WebDashy server is up. App container not deployed yet.\n";
        add_header Content-Type text/plain;
    }

    # --- Reverse proxy to the app container (uncomment in Phase 1) ---
    # location / {
    #     proxy_pass http://app:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # --- TLS (add later once a domain is pointed here via Cloudflare) ---
    # See DEPLOYMENT.md for the Certbot steps. Once configured, this file
    # gets a second `server` block listening on 443 with ssl_certificate
    # directives, and this block becomes a 301 redirect to https.
}
