# WebDashy — Nginx reverse proxy config
#
# Serves both the real domain (HTTPS, via a Cloudflare Origin Certificate —
# see DEPLOYMENT.md "Domain + TLS via Cloudflare") and direct IP access
# (plain HTTP, kept as a fallback for local/debugging use).

# webdashy.com / www.webdashy.com over plain HTTP -> redirect to HTTPS.
# Cloudflare's own "Always Use HTTPS" setting covers visitor traffic before
# it ever reaches here, but redirecting locally too costs nothing and keeps
# the origin correct if it's ever reached a different way.
server {
    listen 80;
    server_name webdashy.com www.webdashy.com;
    return 301 https://$host$request_uri;
}

# Direct IP access — unencrypted on purpose. A Cloudflare Origin
# Certificate is only valid for webdashy.com/*.webdashy.com, so raw-IP
# HTTPS isn't possible here without a separate self-signed cert. Kept
# around for VM-local debugging; not the primary way this app is reached
# once the domain is live.
server {
    listen 80;
    server_name _;

    client_max_body_size 20M;  # headroom for template screenshot uploads

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# webdashy.com / www.webdashy.com over HTTPS — the real thing.
server {
    listen 443 ssl;
    http2 on;
    server_name webdashy.com www.webdashy.com;

    # Paste the Cloudflare Origin Certificate ("Create Certificate" under
    # SSL/TLS > Origin Server) into these two files on the VM directly —
    # see DEPLOYMENT.md. Never committed to git (nginx/certs/ is
    # gitignored except this placeholder note).
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Cloudflare connects from its own edge IPs, not the visitor's —
        # CF-Connecting-IP carries the real one.
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
