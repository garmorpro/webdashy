# WebDashy — Nginx reverse proxy config
#
# Reached via Cloudflare Tunnel (cloudflared, running on this VM) for
# webdashy.com — the VM has no public IP; Cloudflare terminates TLS at
# their edge and the tunnel forwards plain HTTP to this nginx on port 80.
# No certificate/TLS setup is needed here at all. Direct IP access (from
# the local network only, since there's no public IP) goes through this
# same listener.

# cloudflared already knows the original visitor request was HTTPS and
# sets X-Forwarded-Proto accordingly — preserve that instead of
# overwriting it with nginx's own $scheme, which would incorrectly say
# "http" for every request that arrives over the tunnel (this matters:
# getAbsoluteUrl() and Auth.js's secure-cookie behavior both read this
# header). Requests with no such header (e.g. direct IP access) fall
# back to nginx's own scheme, which is correctly "http" in that case.
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;  # headroom for template screenshot uploads

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }
}
