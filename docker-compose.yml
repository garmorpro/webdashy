# WebDashy — Docker Compose stack
#
# Current state: Postgres + Nginx only.
# The `app` service (WebDashy Next.js container) will be added here in
# Phase 1 of ROADMAP.md once the application and its Dockerfile exist.
#
# Usage:
#   cp .env.example .env   # then fill in real values
#   docker compose up -d
#   docker compose logs -f

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - webdashy_db_data:/var/lib/postgresql/data
    ports:
      # Exposed on localhost only — the app container will reach this over
      # the internal compose network, not the host network. Remove this
      # `ports` block entirely once the app service exists, if you don't
      # need host-level DB access for debugging.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # app:
  #   build: .
  #   restart: unless-stopped
  #   env_file: .env
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   expose:
  #     - "3000"
  #   # No published ports — Nginx reverse-proxies to this over the
  #   # compose network by service name (`app:3000`).

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # uncomment once TLS/Certbot is set up (see DEPLOYMENT.md)
    volumes:
      - ./nginx/webdashy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - db
    # depends_on:
    #   app:
    #     condition: service_started

volumes:
  webdashy_db_data:
